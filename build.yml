name: APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3

      - name: Crear proyecto
        run: |
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
            }
          }
          allprojects {
            repositories { google(); mavenCentral() }
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/hitranslate/ultra app/src/main/res/values
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.hitranslate.ultra'
            compileSdk 34
            defaultConfig {
              applicationId "com.hitranslate.ultra"
              minSdk 24
              targetSdk 34
              versionCode 21
              versionName "21.0"
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">HiTranslate</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.HiTranslate" parent="Theme.Material3.DayNight" /></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/Theme.HiTranslate">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/hitranslate/ultra/MainActivity.kt <<'EOF'
          package com.hitranslate.ultra
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val t = TextView(this)
              t.text = "TR-ES-EN OK"
              setContentView(t)
            }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: HiTranslate-APK
          path: app/build/outputs/apk/debug/app-debug.apk
